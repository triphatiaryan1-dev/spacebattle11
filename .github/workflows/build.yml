name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: yes | buildozer android debug > build.log 2>&1 || (cat build.log; exit 1)
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpaceBattle-APK
          path: bin/*.apk
      - name: Upload Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
